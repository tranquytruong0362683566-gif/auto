name: Replace GitHub Pages Site

on:
  push:
    branches:
      - agent/replace-site
    paths:
      - '.deploy/**'
      - '.github/workflows/replace-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: agent/replace-site
          fetch-depth: 0

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/chunk_*.txt > /tmp/site.b64
          base64 --decode /tmp/site.b64 > /tmp/site.tar.gz
          tar -tzf /tmp/site.tar.gz >/dev/null

      - name: Replace main branch contents
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/site.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Replace legacy site with Page Reels and Group Scanner"
          git push origin main
